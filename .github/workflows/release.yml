name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unsigned Squirrel.Windows installer
        run: npm run dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $baseTag = "v$version"
          gh release view $baseTag --repo $env:GITHUB_REPOSITORY *> $null
          $tag = if ($LASTEXITCODE -eq 0) { "$baseTag-build.${{ github.run_number }}" } else { $baseTag }
          $setup = Get-ChildItem -Recurse -Filter '*-Setup-*.exe' dist | Select-Object -First 1
          $releaseIndex = Get-ChildItem -Recurse -Filter 'RELEASES' dist | Select-Object -First 1
          $fullPackage = Get-ChildItem -Recurse -Filter '*-full.nupkg' dist | Select-Object -First 1
          if (-not $setup) { throw 'The Squirrel setup executable was not produced' }
          if (-not $releaseIndex) { throw 'The Squirrel RELEASES index was not produced' }
          if (-not $fullPackage) { throw 'The Squirrel full package was not produced' }
          gh release create $tag $setup.FullName $releaseIndex.FullName $fullPackage.FullName --repo $env:GITHUB_REPOSITORY --title "Wildline Nation $tag" --notes "Unsigned Windows installer from ${{ github.sha }}. Rapid vertical slice release; tests and captures intentionally not run in this pass."
