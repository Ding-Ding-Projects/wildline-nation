name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unsigned Squirrel.Windows installer
        run: npm run dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ github.run_number }}"
          $setup = Get-ChildItem -Recurse -Filter '*Setup.exe' dist | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not produced' }
          gh release create $tag $setup.FullName --repo $env:GITHUB_REPOSITORY --title "Wildline Nation $tag" --notes "Unsigned Windows installer from ${{ github.sha }}. Yum Leung Cha vertical slice; tests and captures intentionally not run in this pass."
